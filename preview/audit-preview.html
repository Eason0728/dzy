<script type="text/plain" id="src-umdbridge">
/**
 * UMD → ESM 轉接層（docs/plan.md「既有測試怎麼搬」那一節指定的做法）
 *
 * 為什麼需要這一層：
 * 從稽核系統原樣搬過來的 format.js／sampling.js／mock-data.js／ops-checklist.js
 * 是 UMD 寫法——node 裡走 `module.exports`，瀏覽器裡掛到 `window.Xxx`。
 * 它們**刻意不改寫成 ESM**，因為既有測試要用 `require()` 載入它們，
 * 改寫暴露方式等於在搬遷的同時改行為（plan.md 有寫，那是這類工程最典型的翻車點）。
 *
 * 但模組本體是 ES module，`import Format from './format.js'` 在瀏覽器裡會直接失敗：
 *   SyntaxError: The requested module does not provide an export named 'default'
 *
 * 這一層就是那道橋：先 `import` 那些檔讓它們執行（副作用是掛上 window.Xxx），
 * 再把全域上的東西轉成具名匯出給模組用。
 *
 * ⚠ 2026-08-15 踩到的教訓：這個問題**node 測試抓不到**。
 * node 把 .js 當 CommonJS，`require()` 一路正常，15 支測試全綠；
 * 只有真的在瀏覽器打開才會爆。跨執行環境的接縫，一定要在真環境點一次。
 */

import './format.js';
import './sampling.js';
import './mock-data.js';
import './ops-checklist.js';

/**
 * 兩個執行環境走的是 UMD 裡不同的分支，所以要兩邊都撐住：
 *
 * - **瀏覽器**：上面的 `import './format.js'` 把它當 ES module 執行（那個檔沒有
 *   import/export，是合法的 module），`module` 是 undefined → 走 `root.Format = ...`
 *   分支，掛到 window 上。所以直接從全域取得。
 * - **node**：`.js` 被當成 CommonJS，走 `module.exports` 分支，**全域上什麼都沒有**。
 *   所以退而用動態 import 取它的 default（node 對 CJS 的互通就是包成 default）。
 *
 * 2026-08-15 踩到的教訓：第一版只寫了瀏覽器那半，node 測試全爆；
 * 而更早之前只寫了 node 那半（模組直接 `import Format from './format.js'`），
 * 15 支測試全綠、瀏覽器一開就爆。**跨環境的接縫，兩邊都要真的跑過一次。**
 */
const g = typeof window !== 'undefined' ? window : globalThis;

async function resolve(name, path) {
  if (g && g[name]) return g[name];
  const mod = await import(path);
  const value = mod.default || mod[name];
  if (!value) {
    throw new Error(
      `[umd-bridge] 取不到 ${name}（試過全域與 ${path} 的 default）——` +
      '那支 UMD 檔可能沒載入成功，或它的暴露名稱改了'
    );
  }
  return value;
}

export const Format = await resolve('Format', './format.js');
export const Sampling = await resolve('Sampling', './sampling.js');
export const MockData = await resolve('MockData', './mock-data.js');
export const OpsChecklist = await resolve('OpsChecklist', './ops-checklist.js');

</script>

<script type="text/plain" id="src-api">
/**
 * modules/audit-shared/api.js — 稽核共用資料層（T2-1）
 *
 * 正本規格：docs/spec.md §4.7（ctx）、§4.8（後端呼叫與回傳格式）、
 * §6.4（兩張稽核卡片、一次後端呼叫——這支就是那一節在講的東西）、
 * §7（店長節點裁切，已經在平台層 platform/api.js 做掉了，這裡不重做）。
 *
 * audit-ops（營運稽核表）與 audit-stock（月初盤點抽查）是首頁兩張獨立模組／卡片，
 * 但共用同一支稽核後端（manifest.backend='audit'，spec §4.1 已約束 backend 必須等於 ns，
 * 兩個模組的 ns 都是 'audit'）。若兩個模組各自呼叫 getAll，同一份資料會被抓兩次；
 * 這支檔案就是它們共用的資料提供者：記憶體快取（TTL 60 秒）＋同時發起的呼叫合併成一次請求。
 *
 * 這一層刻意「薄」，只做資料存取，不做業務邏輯：
 * - 不做節點裁切——平台層 platform/api.js 的 transformResponse_/maybeFilterOwnNode_
 *   已經做過一次（spec §7）。這裡若重做會出現「裁兩次」的難查問題：兩邊過濾邏輯
 *   稍有出入，就會變成「有時候看得到、有時候看不到別店資料」，比完全不裁切更難查。
 * - 不自己發網路請求、不自己組網址——一律透過 ctx.api.call(backendId, action, payload)
 *   （spec §4.7 ctx.api 的簽章、§4.8 的送出格式）。backendId 固定寫死 'audit'：
 *   audit-ops／audit-stock 兩個模組的 manifest.backend 都是 'audit'（spec §4.1／§4.5），
 *   而 ctx 本身不帶 moduleId（spec §4.7 沒有這個欄位），所以「呼叫端該打哪支後端」
 *   在這支共用層裡是固定的，不是從 ctx 動態讀出來的。
 *
 * 快取策略：
 * - getAll(ctx)：快取命中且未過期 → 直接回傳快取值；否則，若已經有一個 in-flight 的
 *   請求在跑（另一個模組的 badge() 或 mount() 幾乎同時觸發），重複使用同一個 Promise，
 *   不再多發一次請求，兩邊等到的是同一份結果；都沒有的話才真的發一次新請求。
 *   只有 {ok:true} 的結果會被存進快取，{ok:false} 絕不快取——否則後端恢復正常之後，
 *   畫面會因為吃到快取住的失敗結果而繼續顯示壞掉的樣子。
 * - invalidate()：清掉快取與 in-flight 標記，下次 getAll() 一定重抓。
 * - submit(ctx, action, payload)：包裝「送出類」action（submitAudit／markRest／
 *   submitOpsAudit……，見 ~/mala-audit/apps-script/Code.gs 的 ACTIONS 清單），
 *   成功後自動 invalidate()，讓下一次 getAll() 看到最新資料；失敗則原樣回傳，不動快取。
 *
 * 時鐘可注入（見 __setClock），測試不必真的等 60 秒。
 */

'use strict';

const BACKEND_ID = 'audit';
const GET_ALL_ACTION = 'getAll';
const TTL_MS = 60 * 1000;

let cache = null;     // { result, expiresAt } —— result 一定是成功的 {ok:true,...}
let inFlight = null;  // 目前進行中的 getAll() Promise；同時發起的呼叫共用它，不重複發請求
let now_ = () => Date.now();

/**
 * 測試用：注入可控時鐘。傳入一個回傳毫秒數的函式，覆寫「現在時間」的來源；
 * 傳非函式（含不傳、傳 null）還原成真實的 Date.now。
 */
export function __setClock(fn) {
  now_ = (typeof fn === 'function') ? fn : () => Date.now();
}

/**
 * 取得稽核後端的全部資料。
 * 回傳形狀已由 platform/api.js 轉接過（spec §4.8）：
 * {ok:true, data:{config, items, records, details, ops_records, ops_details}} | {ok:false, error}
 *
 * @param {object} ctx  平台交給模組的 ctx（spec §4.7），這裡只用到 ctx.api.call
 * @returns {Promise<{ok:true,data:object}|{ok:false,error:string}>}
 */
export async function getAll(ctx) {
  const nowMs = now_();
  if (cache && nowMs < cache.expiresAt) {
    return cache.result;
  }
  if (inFlight) {
    return inFlight;
  }

  inFlight = (async () => {
    try {
      const res = await ctx.api.call(BACKEND_ID, GET_ALL_ACTION, {});
      if (res && res.ok === true) {
        cache = { result: res, expiresAt: now_() + TTL_MS };
      }
      // {ok:false} 不進快取（任務指示第 4 點）：這裡不動 cache，維持它原本的狀態
      // （會走到這裡代表舊快取本來就已經過期或不存在，效果上就是「沒有快取可用」）。
      return res;
    } finally {
      inFlight = null;
    }
  })();

  return inFlight;
}

/** 清掉快取與 in-flight 標記，下次 getAll() 一定重抓。 */
export function invalidate() {
  cache = null;
  inFlight = null;
}

/**
 * 送出類動作的封裝（submitAudit／markRest／submitOpsAudit……）。
 * 成功後自動 invalidate()，讓下一次 getAll() 重抓最新資料；失敗則原樣回傳，不動快取。
 *
 * @param {object} ctx
 * @param {string} action
 * @param {object} payload
 * @returns {Promise<{ok:true,data:object}|{ok:false,error:string}>}
 */
export async function submit(ctx, action, payload) {
  // 試跑模式（網址加 ?dryrun=1）：讀取照常走真實後端，但**寫入一律攔下不送出**。
  // 存在的理由：稽核後端接的是會計每個月實際在用的正式試算表。
  // 要請人實際點過一輪給意見時，不能讓「試按一下送出」變成一筆假資料寫進正式資料。
  // 這不是測試替身，是給真人試用時的安全閥——所以它留在正式程式碼裡，只靠網址開關。
  if (isDryRun()) {
    console.warn('[試跑模式] 攔下一次寫入，未送出到後端：', action, payload);
    return { ok: true, data: { dryRun: true, action, payload } };
  }

  const res = await ctx.api.call(BACKEND_ID, action, payload);
  if (res && res.ok === true) {
    invalidate();
  }
  return res;
}

/** 網址帶 ?dryrun=1 就進入試跑模式。非瀏覽器環境（node 測試）一律不啟用。 */
export function isDryRun() {
  try {
    if (typeof window === 'undefined' || !window.location) return false;
    return new URLSearchParams(window.location.search).get('dryrun') === '1';
  } catch {
    return false;
  }
}

</script>

<script type="text/plain" id="src-fillcashbox">
/**
 * modules/audit-stock/views/fill-cashbox.js — 稽核填寫：金庫抽查＋共用的兩態切換鈕（T2-3 第二段）
 *
 * 正本規格：docs/spec.md §4.10（ctx.fmt.esc／UI 一律用 platform/css/components.css
 * 既有 class，不新增色碼、不內嵌樣式）。
 * 來源：~/mala-audit/js/views/audit.js 金庫區塊（vaultChoiceGroup／renderVaultBody／
 * renderVault，原檔 615-645 行一帶）。
 *
 * 舊版金庫三個核定（零找金／零用金／小費相符）與「填寫方式」「單項正確／異常」
 * 都是同一種 UI：一組互斥的切換鈕，選中的用行內樣式標成 active。這裡改用 platform
 * 既有的 .btn-primary（選中）／.btn-secondary（未選中）互換來表示 active 狀態，
 * 不新增色碼、不內嵌樣式（spec §4.10）——所以 buildChoiceGroup() 順便輸出給
 * fill.js 共用（填寫方式、單項正確／異常都是同一顆元件），不是本檔獨有。
 * DOM 的 data-group／data-value／既有 id（audit-vault-card／audit-vault-body／
 * audit-tip-amount／audit-note）原樣保留。
 */
'use strict';

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const value = attrs[key];
      if (value === undefined || value === null) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else node.setAttribute(key, value);
    }
  }
  if (children) {
    for (const child of children) if (child) node.appendChild(child);
  }
  return node;
}

/** 顯示後端資料一律經 ctx.fmt.esc()（同 modules/audit-stock/views/overview.js 的 escEl() 慣例）。 */
function escEl(ctx, tag, attrs, value) {
  const node = el(tag, attrs);
  node.innerHTML = ctx.fmt.esc(value);
  return node;
}

/** 標準金額顯示：10000 → '1 萬'；整萬數一律顯示「N 萬」，其他原數字顯示（照抄 stdLabel()）。 */
export function stdLabel(std) {
  if (typeof std !== 'number' || !std) return String(std || '');
  if (std % 10000 === 0) return (std / 10000) + ' 萬';
  return String(std);
}

/**
 * 一組互斥切換鈕（二選一或多選一）：選中的用 .btn-primary，未選中用 .btn-secondary，
 * class 額外掛 `active` 方便測試／既有 e2e 選擇器辨識目前選了哪個。
 * @param {string} group        data-group 值（例 'change_fund'）
 * @param {string[]} options    可選值（例 ['正確','不正確']）
 * @param {string} current      目前選中的值
 * @param {function} onPick     (group, value) => void
 * @param {string} [btnClass]   額外掛在每顆按鈕上的 class（例 'audit-vault-btn'）
 */
export function buildChoiceGroup(group, options, current, onPick, btnClass) {
  const wrap = el('div', { class: 'audit-choice-group card-row', 'data-group': group });
  options.forEach((v) => {
    const active = current === v;
    const cls = ['btn', active ? 'btn-primary' : 'btn-secondary', btnClass, active ? 'active' : '']
      .filter(Boolean).join(' ');
    const btn = el('button', {
      type: 'button', class: cls, 'data-group': group, 'data-value': v, text: v
    });
    btn.addEventListener('click', () => onPick(group, v));
    wrap.appendChild(btn);
  });
  return wrap;
}

/**
 * 掛上金庫抽查卡片。呼叫端（fill.js）負責存草稿／重繪其他區塊；本函式只管
 * 金庫這張卡片自己的 DOM 與互動。
 *
 * @param {object} ctx
 * @param {function} getConfig  () => config（spec §4.8 的 config，含 change_fund_std／
 *                              petty_cash_std）——傳函式而不是物件本身，因為 fill.js 在
 *                              loadData() 拿到後端資料後會把外層 config 變數整個重新指派
 *                              （不是原地改內容），傳物件參照的話這裡拿到的會是掛載當下
 *                              那個空殼、看不到後來載入的真正設定。
 * @param {function} getState   () => vaultState（{change_fund,petty_cash,tip_amount,tip_match,note}）
 * @param {function} onChange   (patch) => void，欄位變動時呼叫，呼叫端合併進 vaultState
 * @returns {{el: HTMLElement, refresh: function}} refresh() 依 getState() 目前值重繪（切店／月／還原草稿時呼叫）
 */
export function mountVaultCard(ctx, getConfig, getState, onChange) {
  const bodyEl = el('div', { id: 'audit-vault-body' });
  const noteEl = el('textarea', {
    id: 'audit-note', class: 'input', rows: '3', placeholder: '（選填）'
  });
  noteEl.addEventListener('input', () => onChange({ note: noteEl.value }));

  const card = el('div', { class: 'card', id: 'audit-vault-card' }, [
    el('div', { class: 'card-title', text: '金庫抽查' }),
    bodyEl,
    el('div', { class: 'field' }, [
      el('label', { for: 'audit-note', class: 'field-label', text: '整單備註' }),
      noteEl
    ])
  ]);

  function refresh() {
    const state = getState();
    const config = getConfig() || {};
    while (bodyEl.firstChild) bodyEl.removeChild(bodyEl.firstChild);

    const tipInput = el('input', {
      type: 'number', step: 'any', inputmode: 'decimal', id: 'audit-tip-amount', class: 'input',
      value: state.tip_amount === undefined || state.tip_amount === null ? '' : state.tip_amount
    });
    tipInput.addEventListener('input', () => onChange({ tip_amount: tipInput.value }));

    bodyEl.appendChild(el('div', { class: 'audit-vault-row field' }, [
      escEl(ctx, 'label', { class: 'field-label' }, '零找金（標準 ' + stdLabel(config.change_fund_std) + '）'),
      buildChoiceGroup('change_fund', ['正確', '不正確'], state.change_fund,
        (g, v) => onChange({ [g]: v }), 'audit-vault-btn')
    ]));
    bodyEl.appendChild(el('div', { class: 'audit-vault-row field' }, [
      escEl(ctx, 'label', { class: 'field-label' }, '零用金（標準 ' + stdLabel(config.petty_cash_std) + '）'),
      buildChoiceGroup('petty_cash', ['正確', '不正確'], state.petty_cash,
        (g, v) => onChange({ [g]: v }), 'audit-vault-btn')
    ]));
    bodyEl.appendChild(el('div', { class: 'audit-vault-row field' }, [
      el('label', { for: 'audit-tip-amount', class: 'field-label', text: '小費金額' }),
      tipInput,
      buildChoiceGroup('tip_match', ['相符', '不相符'], state.tip_match,
        (g, v) => onChange({ [g]: v }), 'audit-vault-btn')
    ]));

    noteEl.value = state.note || '';
  }

  refresh();
  return { el: card, refresh };
}

</script>

<script type="text/plain" id="src-fillsubmit">
/**
 * modules/audit-stock/views/fill-submit.js — 稽核填寫：驗證／建立送出內容／草稿（T2-3 第三段）
 *
 * 正本規格：docs/spec.md §4.8（送出格式，本檔 buildRecord/buildDetails 就是在組這個形狀）。
 * 來源：~/mala-audit/js/views/audit.js 的 validate()／buildRecord()／buildDetails()／
 * 草稿相關函式（原檔第 44-97、252-300、647-777 行一帶），逐字元行為照抄，只是抽成
 * 不碰 DOM 的純函式＋一組 localStorage 存取，方便 fill.js 呼叫、也方便直接單元測試
 * （不必真的掛 DOM 就能驗「缺單位擋下」「只填異常項分母固定」這類規則）。
 *
 * 抽查標準項數 SAMPLE_SIZE：舊版來自 ~/mala-audit/js/config.js 的 Config.SAMPLE_SIZE
 * ——那本身就是前端寫死的常數（不是後端 config 的一部分，該檔案註解寫得很清楚）。
 * 新系統沒有對應的 ctx.config 通道，這裡原樣沿用同一個寫死常數，不是遺漏，是照抄
 * 舊版原本就沒有經過後端的東西。
 *
 * 草稿沿用舊版做法直接用瀏覽器 localStorage（不透過 ctx.api，草稿本來就只是本機
 * 暫存，不是要送後端的資料）：key 規則 `draft_{store}_{month}`，只填異常項模式多
 * 後綴 `_anomaly`，兩種模式的草稿分開存互不覆蓋（同舊版 draftKeyFor()）。
 */
'use strict';

import { Format } from '../../audit-shared/umd-bridge.js';

export const SAMPLE_SIZE = 20;
export const MODE_FULL = 'full';
export const MODE_ANOMALY = 'anomaly';

const MODE_KEY = 'audit_fill_mode';
const LAST_STORE_KEY = 'audit_last_store';

export function isAnomalyMode(mode) {
  return mode === MODE_ANOMALY;
}

/**
 * 品項填值正規化：確保每項都有填寫用的欄位（預設空）。
 * 只填異常項模式下，清單裡的每一項本來就是異常項，判定直接固定成「異常」——
 * 畫面不再顯示正確／異常按鈕，也就沒有「忘了核定」這種狀態（同舊版 normalizeItem()）。
 */
export function normalizeItem(it, mode) {
  return {
    name: it.name,
    unit: it.unit || '', // 品項庫可能沒填單位，統一成空字串好判斷
    lastDrawn: it.lastDrawn || null,
    book_qty: it.book_qty !== undefined && it.book_qty !== null ? it.book_qty : '',
    recount_qty: it.recount_qty !== undefined && it.recount_qty !== null ? it.recount_qty : '',
    verdict: isAnomalyMode(mode) ? '異常' : (it.verdict || ''),
    reason: it.reason || '',
    note: it.note || ''
  };
}

export function isBlankNumber(v) {
  return v === '' || v === null || v === undefined || isNaN(Number(v));
}

/** 只填異常項模式：異常數超過標準項數就沒有意義（正確項會變負數），擋下並提示。 */
export function tooManyAnomalies(mode, itemCount, sampleSize) {
  return isAnomalyMode(mode) && itemCount > (sampleSize || SAMPLE_SIZE);
}

/**
 * 驗證（spec §7 枚舉逐字元，照抄 ~/mala-audit/js/views/audit.js 的 validate()）。
 * @param {{mode:string, items:object[], vault:object, sampleSize?:number}} input
 * @returns {string[]} 錯誤訊息陣列；空陣列＝可以送出
 */
export function validate({ mode, items, vault, sampleSize }) {
  const size = sampleSize || SAMPLE_SIZE;
  const errors = [];
  const anomalyMode = isAnomalyMode(mode);
  const list = items || [];
  const v = vault || {};

  // 只填異常項模式：0 項異常是合法的（＝全部正確，正確率 100%），不能擋。
  if (!anomalyMode && list.length === 0) {
    errors.push('尚未抽樣，清單是空的');
  }
  if (tooManyAnomalies(mode, list.length, size)) {
    errors.push('異常 ' + list.length + ' 項，已超過標準 ' + size + ' 項，請刪除多餘項目');
  }

  list.forEach((it, idx) => {
    const label = (idx + 1) + '.' + it.name;
    // 單位不分來源都要有：品項庫本身就有留空單位的項目，抽到那些項目異常說明會
    // 少一塊（2026-08-07 實查到真實案例）。缺單位的當場補，不用回試算表改。
    if (!it.unit || !String(it.unit).trim()) errors.push(label + '：缺單位，請在該列補上');
    if (isBlankNumber(it.book_qty)) errors.push(label + '：門市盤點數未填');
    if (isBlankNumber(it.recount_qty)) errors.push(label + '：會計複盤數未填');
    if (anomalyMode) {
      if (!it.reason) {
        errors.push(label + '：異常需選擇原因');
      } else if (it.reason === '其他' && !(it.note && it.note.trim())) {
        errors.push(label + '：原因為「其他」需填寫備註');
      }
      return;
    }
    if (it.verdict !== '正確' && it.verdict !== '異常') {
      errors.push(label + '：尚未核定正確／異常');
    } else if (it.verdict === '異常') {
      if (!it.reason) {
        errors.push(label + '：異常需選擇原因');
      } else if (it.reason === '其他' && !(it.note && it.note.trim())) {
        errors.push(label + '：原因為「其他」需填寫備註');
      }
    }
  });

  if (v.change_fund !== '正確' && v.change_fund !== '不正確') {
    errors.push('零找金尚未核定');
  }
  if (v.petty_cash !== '正確' && v.petty_cash !== '不正確') {
    errors.push('零用金尚未核定');
  }
  if (isBlankNumber(v.tip_amount)) {
    errors.push('小費金額未填');
  }
  if (v.tip_match !== '相符' && v.tip_match !== '不相符') {
    errors.push('小費是否相符尚未核定');
  }
  return errors;
}

function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

export function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

export function nowIso(d) {
  d = d || new Date();
  const tzOffsetMin = -d.getTimezoneOffset();
  const sign = tzOffsetMin >= 0 ? '+' : '-';
  const abs = Math.abs(tzOffsetMin);
  const oh = pad2(Math.floor(abs / 60));
  const om = pad2(abs % 60);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) +
    sign + oh + ':' + om;
}

/**
 * 建送出的 record（spec §4.8 送出格式；照抄 buildRecord()）。
 * 完整模式：分母＝實際清單項數，正確數＝核定為正確的項數。
 * 只填異常項模式：分母固定 sampleSize，正確數＝sampleSize − 異常項數
 * ——沒被輸入的品項不必逐項核定，直接視同正確（Format.anomalyOnlyCounts 負責這條算式）。
 */
export function buildRecord({ store, month, mode, items, vault, sampleSize, now }) {
  const size = sampleSize || SAMPLE_SIZE;
  const list = items || [];
  const v = vault || {};
  const counts = isAnomalyMode(mode)
    ? Format.anomalyOnlyCounts(list.length, size)
    : (() => {
        const total = list.length;
        const correctCount = list.filter((it) => it.verdict === '正確').length;
        return {
          sample_count: total,
          correct_count: correctCount,
          correct_rate: Format.correctRate(correctCount, total)
        };
      })();
  const anomalyForText = list
    .filter((it) => isAnomalyMode(mode) || it.verdict === '異常')
    .map((it) => ({ item: it.name, unit: it.unit, book_qty: it.book_qty, recount_qty: it.recount_qty, verdict: '異常' }));

  return {
    record_key: Format.recordKey(store, month),
    store,
    month,
    status: '已稽核',
    audit_date: todayStr(now),
    sample_count: counts.sample_count,
    correct_count: counts.correct_count,
    correct_rate: counts.correct_rate,
    change_fund: v.change_fund,
    petty_cash: v.petty_cash,
    tip_amount: Number(v.tip_amount),
    tip_match: v.tip_match,
    anomaly_text: Format.buildAnomalyText(anomalyForText),
    note: v.note || '',
    submitted_at: nowIso(now)
  };
}

/** 建送出的 details（照抄 buildDetails()）。只填異常項模式下清單裡本來就只有異常項。 */
export function buildDetails({ store, month, items, mode }) {
  const key = Format.recordKey(store, month);
  return (items || []).map((it) => {
    const isAnomaly = isAnomalyMode(mode) || it.verdict === '異常';
    return {
      record_key: key,
      store,
      month,
      item: it.name,
      unit: it.unit,
      book_qty: Number(it.book_qty),
      recount_qty: Number(it.recount_qty),
      verdict: isAnomaly ? '異常' : it.verdict,
      reason: isAnomaly ? (it.reason || '') : '',
      note: isAnomaly ? (it.note || '') : ''
    };
  });
}

// ============================================================
// 草稿（localStorage；同舊版 key 規則）
// ============================================================

function storage() {
  try {
    return typeof localStorage !== 'undefined' ? localStorage : null;
  } catch (e) {
    return null;
  }
}

export function draftKeyFor(store, month, mode) {
  return 'draft_' + Format.recordKey(store, month) + (isAnomalyMode(mode) ? '_anomaly' : '');
}

export function saveDraft(store, month, mode, items, vault) {
  const s = storage();
  if (!s || !store || !month) return;
  try {
    const payload = {
      store,
      month,
      items: (items || []).map((it) => ({
        name: it.name, unit: it.unit, lastDrawn: it.lastDrawn,
        book_qty: it.book_qty, recount_qty: it.recount_qty,
        verdict: it.verdict, reason: it.reason, note: it.note
      })),
      vault
    };
    s.setItem(draftKeyFor(store, month, mode), JSON.stringify(payload));
  } catch (e) { /* 儲存空間不可用時忽略，不擋操作 */ }
}

export function loadDraft(store, month, mode) {
  const s = storage();
  if (!s) return null;
  try {
    const raw = s.getItem(draftKeyFor(store, month, mode));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

/** 送出成功時兩種模式的草稿一起清，避免另一把舊 key 之後又冒出來（同舊版 clearDraft()）。 */
export function clearDraft(store, month) {
  const s = storage();
  if (!s) return;
  try {
    s.removeItem(draftKeyFor(store, month, MODE_FULL));
    s.removeItem(draftKeyFor(store, month, MODE_ANOMALY));
  } catch (e) { /* 忽略 */ }
}

function draftHasContent(payload) {
  if (!payload) return false;
  if ((payload.items || []).length) return true;
  const v = payload.vault || {};
  return !!(v.change_fund || v.petty_cash || v.tip_amount || v.tip_match || v.note);
}

/** 列出所有還沒送出的草稿（同舊版 listDrafts()，跨店月掃描 localStorage）。 */
export function listDrafts() {
  const s = storage();
  const out = [];
  if (!s) return out;
  try {
    for (let i = 0; i < s.length; i++) {
      const k = s.key(i);
      if (!k || k.indexOf('draft_') !== 0) continue;
      let payload = null;
      try { payload = JSON.parse(s.getItem(k)); } catch (e) { payload = null; }
      if (!payload || !payload.store || !payload.month) continue;
      if (!draftHasContent(payload)) continue;
      out.push({
        key: k,
        store: payload.store,
        month: payload.month,
        mode: /_anomaly$/.test(k) ? MODE_ANOMALY : MODE_FULL,
        count: (payload.items || []).length
      });
    }
  } catch (e) { /* 儲存空間不可用時當作沒有草稿 */ }
  out.sort((a, b) => {
    if (a.month !== b.month) return a.month < b.month ? 1 : -1; // 新的月份排前面
    return a.store < b.store ? -1 : 1;
  });
  return out;
}

/** 找某家店最近一份「有內容的未送出草稿」→ {month, mode}；沒有回 null（同舊版 latestDraftForStore()）。 */
export function latestDraftForStore(store) {
  if (!store) return null;
  let best = null;
  listDrafts().filter((d) => d.store === store).forEach((d) => {
    if (!best || d.month > best.month) best = { month: d.month, mode: d.mode };
  });
  return best;
}

export function dropDraft(key) {
  const s = storage();
  if (!s) return;
  try { s.removeItem(key); } catch (e) { /* 忽略 */ }
}

export function readDraftByKey(key) {
  const s = storage();
  if (!s) return null;
  try {
    const raw = s.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

export function loadMode() {
  const s = storage();
  if (!s) return MODE_FULL;
  try {
    const m = s.getItem(MODE_KEY);
    return m === MODE_ANOMALY ? MODE_ANOMALY : MODE_FULL;
  } catch (e) {
    return MODE_FULL;
  }
}

export function persistMode(mode) {
  const s = storage();
  if (!s) return;
  try { s.setItem(MODE_KEY, mode); } catch (e) { /* 忽略 */ }
}

export function loadLastStore() {
  const s = storage();
  if (!s) return null;
  try { return s.getItem(LAST_STORE_KEY); } catch (e) { return null; }
}

export function persistLastStore(store) {
  const s = storage();
  if (!s || !store) return;
  try { s.setItem(LAST_STORE_KEY, store); } catch (e) { /* 忽略 */ }
}

</script>

<script type="text/plain" id="src-overview">
/**
 * modules/audit-stock/views/overview.js — 月初盤點抽查・總覽畫面（T2-2）
 *
 * 正本規格：docs/spec.md §4.6（mount(el,ctx) 回傳 unmount）、§4.7（ctx 逐字元形狀）、
 * §4.10（ctx.ui／ctx.fmt 簽章；UI 一律用 platform/css/components.css 既有 class，
 * 不新增色碼、不內嵌樣式）。
 *
 * 來源：~/mala-audit/js/views/overview.js（204 行，window.Views.overview = {render}）。
 * DOM 結構與資料語意盡量原樣保留（既有 e2e 的選擇器才不會全部失效）：id
 * （overview-year／btn-start-audit／btn-mark-rest／rest-dialog／rest-store／
 * rest-month／rest-error／rest-confirm／rest-cancel）與舊版的結構性 class
 * （overview-toolbar／overview-actions／overview-grid-wrap／overview-grid／
 * grid-cell，含 data-store／data-month／data-clickable）都保留，但拿掉全部行內
 * style，改疊上 platform 既有的 .card／.table／.table-wrap／.btn／.tag／.field
 * 等 class 負責實際外觀——舊版本身就沒有這套元件可用，是這次搬遷才補上的。
 *
 * 資料一律經 audit-shared/api.js 的 getAll(ctx)／submit(ctx, action, payload)
 * 取得與送出（不自己呼叫 ctx.api），成功送出後 submit() 會自動 invalidate 快取。
 *
 * 角色判斷：舊版用 app.state.role === 'accountant' 決定要不要顯示「開始稽核」
 * 「標記輪休」兩個動作。舊系統只有 accountant／viewer 兩種角色，只有 accountant
 * 能寫入；新系統的權限碼對照（spec §4.2／§4.3）裡，也只有 accountant（與萬用字元
 * admin）持有 audit.write，其餘角色都沒有——與舊版行為等價，所以改用
 * ctx.can('audit.write') 判斷，而不是比對角色代號字串（角色代號本身不是 ctx 該給
 * 模組拿來做業務判斷的東西，spec §4.7 只保證 ctx.user.role 存在，沒保證角色清單
 * 不會再變動；can() 才是穩定的判斷介面）。
 */
'use strict';

import * as sharedApi from '../../audit-shared/api.js';

const YEARS = ['2026']; // 預留多年：之後只要加這個陣列（同舊版）

// 對照 modules/audit-shared/format.js 的 monthLabel()：純顯示用的靜態月份中文對照表，
// 不是業務邏輯，不值得為了這一個用途另外搭一層 UMD→ESM 轉接（那是後續任務要做的事）。
const MONTH_LABELS = {
  '01': '一月', '02': '二月', '03': '三月', '04': '四月',
  '05': '五月', '06': '六月', '07': '七月', '08': '八月',
  '09': '九月', '10': '十月', '11': '十一月', '12': '十二月'
};

function monthLabel(month) {
  const mm = String(month).split('-')[1];
  return MONTH_LABELS[mm] || mm;
}

function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

function monthCols() {
  const cols = [];
  for (let m = 1; m <= 12; m++) cols.push(pad2(m));
  return cols;
}

// ============================================================
// 小工具：DOM 建構（做法同 modules/users/views/list.js，模組自己一份，
// 平台層沒有輸出這個工具給模組用）
// ============================================================

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const value = attrs[key];
      if (value === undefined || value === null) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else node.setAttribute(key, value);
    }
  }
  if (children) {
    for (const child of children) if (child) node.appendChild(child);
  }
  return node;
}

/** 顯示後端資料一律經 ctx.fmt.esc()（同 modules/users/views/list.js 的 textCell() 慣例）。 */
function escEl(ctx, tag, attrs, value) {
  const node = el(tag, attrs);
  node.innerHTML = ctx.fmt.esc(value);
  return node;
}

/**
 * @param {HTMLElement} root 殼／index.js 給的掛載點
 * @param {object} ctx spec §4.7
 * @returns {function} unmount
 */
export function mountOverview(root, ctx) {
  let destroyed = false;
  let config = { stores: [] };
  let records = [];
  let recordMap = {}; // record_key -> record，renderGrid() 重建，buildGridCell() 讀
  let year = YEARS[0];
  const canWrite = ctx.can('audit.write');

  // ---- 骨架：年份工具列 ----
  const yearSelect = el('select', { id: 'overview-year', class: 'input' });
  YEARS.forEach((y) => yearSelect.appendChild(el('option', { value: y, text: y })));
  yearSelect.value = year;

  const toolbar = el('div', { class: 'overview-toolbar card-row' }, [
    el('label', { for: 'overview-year', class: 'field-label', text: '年份' }),
    yearSelect
  ]);

  // ---- 骨架：會計限定的動作列（開始稽核／標記輪休）----
  let startBtn = null;
  let markRestBtn = null;
  let actionsRow = null;
  if (canWrite) {
    startBtn = el('button', {
      type: 'button', id: 'btn-start-audit', class: 'btn btn-primary', text: '開始稽核'
    });
    markRestBtn = el('button', {
      type: 'button', id: 'btn-mark-rest', class: 'btn btn-secondary', text: '標記輪休'
    });
    actionsRow = el('div', { class: 'overview-actions card-row' }, [startBtn, markRestBtn]);
  }

  // ---- 骨架：抽查總覽表格 ----
  const theadEl = el('thead');
  const tbodyEl = el('tbody');
  const table = el('table', { class: 'table overview-grid' }, [theadEl, tbodyEl]);
  const tableWrap = el('div', { class: 'table-wrap overview-grid-wrap' }, [table]);

  const cardTitle = el('div', { class: 'card-title', text: '總覽' });
  const gridCard = el('div', { class: 'card' },
    [cardTitle, toolbar].concat(actionsRow ? [actionsRow] : []).concat([tableWrap]));

  // ---- 骨架：標記輪休表單（會計限定，預設隱藏；沿用舊版「行內卡片」而非浮層對話框）----
  let restDialogCard = null;
  let restStoreSelect = null;
  let restMonthSelect = null;
  let restErrorEl = null;
  let restConfirmBtn = null;
  let restCancelBtn = null;

  if (canWrite) {
    restStoreSelect = el('select', { id: 'rest-store', class: 'input' });
    restMonthSelect = el('select', { id: 'rest-month', class: 'input' });
    restErrorEl = el('p', { id: 'rest-error', class: 'field-hint', hidden: 'true' });
    restConfirmBtn = el('button', {
      type: 'button', id: 'rest-confirm', class: 'btn btn-primary', text: '確認'
    });
    restCancelBtn = el('button', {
      type: 'button', id: 'rest-cancel', class: 'btn btn-secondary', text: '取消'
    });

    restDialogCard = el('div', { id: 'rest-dialog', class: 'card', hidden: 'true' }, [
      el('div', { class: 'card-title', text: '標記輪休' }),
      el('div', { class: 'field' }, [
        el('label', { for: 'rest-store', class: 'field-label', text: '店別' }),
        restStoreSelect
      ]),
      el('div', { class: 'field' }, [
        el('label', { for: 'rest-month', class: 'field-label', text: '月份' }),
        restMonthSelect
      ]),
      restErrorEl,
      el('div', { class: 'dialog-actions' }, [restCancelBtn, restConfirmBtn])
    ]);
  }

  root.appendChild(gridCard);
  if (restDialogCard) root.appendChild(restDialogCard);

  // ============================================================
  // 渲染
  // ============================================================

  function renderGrid() {
    const cols = monthCols();
    const stores = (config.stores || []).slice().sort((a, b) => a.order - b.order);
    recordMap = {};
    records.forEach((r) => { recordMap[r.record_key] = r; });

    while (theadEl.firstChild) theadEl.removeChild(theadEl.firstChild);
    const headCells = [el('th', { text: '店別' })].concat(
      cols.map((mm) => el('th', { text: Number(mm) + '月' }))
    );
    theadEl.appendChild(el('tr', {}, headCells));

    while (tbodyEl.firstChild) tbodyEl.removeChild(tbodyEl.firstChild);
    stores.forEach((store) => {
      const cells = cols.map((mm) => buildGridCell(store, mm));
      tbodyEl.appendChild(el('tr', {}, [escEl(ctx, 'th', {}, store.name)].concat(cells)));
    });

    if (canWrite) renderRestOptions(stores, cols);
  }

  function buildGridCell(store, mm) {
    const month = year + '-' + mm;
    const key = store.code + '_' + month;
    const rec = recordMap[key];

    const td = document.createElement('td');
    td.className = 'grid-cell';
    td.setAttribute('data-store', store.code);
    td.setAttribute('data-month', month);

    if (rec && rec.status === '已稽核') {
      td.setAttribute('data-clickable', '1');
      td.appendChild(escEl(ctx, 'span', { class: 'tag tag-ok' }, rec.correct_rate + '%'));
      td.addEventListener('click', () => {
        ctx.nav('report', { store: store.code, month });
      });
    } else if (rec && rec.status === '輪休') {
      td.textContent = '輪休';
    } else {
      td.textContent = '—';
    }
    return td;
  }

  function renderRestOptions(stores, cols) {
    while (restStoreSelect.firstChild) restStoreSelect.removeChild(restStoreSelect.firstChild);
    stores.forEach((s) => {
      restStoreSelect.appendChild(escEl(ctx, 'option', { value: s.code }, s.name));
    });

    while (restMonthSelect.firstChild) restMonthSelect.removeChild(restMonthSelect.firstChild);
    cols.forEach((mm) => {
      restMonthSelect.appendChild(el('option', { value: mm, text: monthLabel(year + '-' + mm) }));
    });
  }

  // ============================================================
  // 資料載入
  // ============================================================

  async function loadData() {
    ctx.ui.loading(true);
    try {
      const res = await sharedApi.getAll(ctx);
      if (destroyed) return;
      if (!res || res.ok !== true) {
        ctx.ui.toast((res && res.error) || '發生錯誤，請稍後再試', 'danger');
        return;
      }
      config = (res.data && res.data.config) || { stores: [] };
      records = (res.data && res.data.records) || [];
      renderGrid();
    } catch {
      if (!destroyed) ctx.ui.toast('發生錯誤，請稍後再試', 'danger');
    } finally {
      if (!destroyed) ctx.ui.loading(false);
    }
  }

  // ============================================================
  // 事件
  // ============================================================

  function onYearChange() {
    year = yearSelect.value;
    renderGrid();
  }
  yearSelect.addEventListener('change', onYearChange);

  function onStartAuditClick() {
    ctx.nav('fill');
  }

  function onMarkRestClick() {
    restErrorEl.hidden = true;
    restDialogCard.hidden = false;
  }

  function onRestCancelClick() {
    restDialogCard.hidden = true;
  }

  async function onRestConfirmClick() {
    const storeCode = restStoreSelect.value;
    const mm = restMonthSelect.value;
    const month = year + '-' + mm;
    restConfirmBtn.disabled = true;
    try {
      const res = await sharedApi.submit(ctx, 'markRest', { store: storeCode, month });
      if (destroyed) return;
      if (res && res.ok) {
        restDialogCard.hidden = true;
        await loadData();
      } else {
        restErrorEl.textContent = '標記輪休失敗，請重試';
        restErrorEl.hidden = false;
      }
    } finally {
      if (!destroyed) restConfirmBtn.disabled = false;
    }
  }

  if (canWrite) {
    startBtn.addEventListener('click', onStartAuditClick);
    markRestBtn.addEventListener('click', onMarkRestClick);
    restCancelBtn.addEventListener('click', onRestCancelClick);
    restConfirmBtn.addEventListener('click', onRestConfirmClick);
  }

  loadData();

  return function unmount() {
    destroyed = true;
    yearSelect.removeEventListener('change', onYearChange);
    if (canWrite) {
      startBtn.removeEventListener('click', onStartAuditClick);
      markRestBtn.removeEventListener('click', onMarkRestClick);
      restCancelBtn.removeEventListener('click', onRestCancelClick);
      restConfirmBtn.removeEventListener('click', onRestConfirmClick);
    }
    if (gridCard.parentNode) gridCard.parentNode.removeChild(gridCard);
    if (restDialogCard && restDialogCard.parentNode) restDialogCard.parentNode.removeChild(restDialogCard);
  };
}

</script>

<script type="text/plain" id="src-fill">
/**
 * modules/audit-stock/views/fill.js — 月初盤點抽查・稽核填寫畫面（T2-3）
 *
 * 正本規格：docs/spec.md §4.6（mount(el,ctx) 回傳 unmount）、§4.7（ctx，含 viewId／params）、
 * §4.10（ctx.ui／ctx.fmt 簽章；UI 一律用 platform/css/components.css 既有 class，
 * 不新增色碼、不內嵌樣式）。
 *
 * 來源：~/mala-audit/js/views/audit.js（1157 行，window.Views.audit = {render}），
 * 拆成三支：本檔（骨架＋抽樣區＋品項清單，對照原檔 T4「抽樣區」段落）、
 * fill-cashbox.js（金庫抽查，對照原檔 615-645 行）、fill-submit.js（驗證／建送出內容／
 * 草稿，不碰 DOM 的純函式，對照原檔 44-97、252-300、647-777 行）。三支的行為合起來
 * 就是原檔的 render()，DOM 結構與 class 名盡量原樣保留（既有 e2e 的選擇器才不會失效）：
 * id（audit-store／audit-month／audit-drafts-card／audit-drafts-list／audit-mode-group／
 * audit-mode-hint／audit-draw／audit-add-input／audit-item-datalist／audit-add-unit／
 * audit-add-btn／audit-add-hint／audit-add-error／audit-count-warning／audit-items／
 * audit-vault-card／audit-vault-body／audit-tip-amount／audit-note／audit-submit-error／
 * audit-submit-btn／audit-retry-btn）與結構性 class（audit-item-row／audit-item-fill／
 * audit-item-qty-row／audit-choice-group／audit-verdict-btn／audit-vault-btn／
 * audit-anomaly-detail／audit-draft-row 等）都保留；舊版用 JS 內嵌 <style> 標記 active／
 * 顏色，這裡改疊 platform 既有的 .card／.table／.btn／.btn-primary／.btn-secondary／
 * .tag／.field／.input 等 class 負責外觀（spec §4.10：不新增色碼、不內嵌樣式）。
 *
 * 資料一律經 audit-shared/api.js 的 getAll(ctx)／submit(ctx, action, payload) 取得與
 * 送出（不自己呼叫 ctx.api），成功送出後 submit() 會自動 invalidate() 快取，下一次
 * 進報告頁（T2-4，尚未實作）呼叫 getAll() 就會拿到剛送出的新資料——這也是本檔不必
 * 像舊版 app.reload() 那樣手動重抓一次的原因（見下方 performSubmit() 的說明）。
 *
 * 寫入權限一律用 ctx.can('audit.write') 判斷（不比對角色代號字串，同 overview.js 的
 * 理由：manifest.js 的 fill 分頁本身就 requires:['audit.write']，正常路由不會讓沒權限
 * 的人進到這裡；這裡的 canWrite 檢查是第二道防線——見 spec §4.6 對「模組不得只信任
 * 平台已經擋過一次」的一貫做法，overview.js 的 canWrite 也是同樣用途）。沒有寫入權限
 * 時完全不畫表單，只顯示提示卡片，符合「看不到送出控制項」這條驗收。
 *
 * 覆蓋確認：舊版用一張行內卡片（#audit-overwrite-dialog）＋自己的確認／取消鈕；
 * 這裡改用 ctx.ui.confirm()（spec §4.10 已提供的標準確認框）——對使用者來說是同一個
 * 操作（送出前被問一次「確定要覆蓋嗎」）、同一個結果（確認才送出、取消不送出），
 * 只是介面元件從模組自己刻的卡片換成平台既有元件，行為等價，DOM 少了一組 id
 * （audit-overwrite-dialog 等），這點記在任務回報的「與舊版差異」。
 *
 * 抽查標準項數 SAMPLE_SIZE、金庫抽查、驗證、建送出內容、草稿存取都在另外兩支，
 * 本檔只負責畫面骨架、抽樣/品項清單的 DOM 與事件、以及把各段串起來。
 */
'use strict';

import * as sharedApi from '../../audit-shared/api.js';
import { Sampling, Format } from '../../audit-shared/umd-bridge.js';
import * as FillSubmit from './fill-submit.js';
import { mountVaultCard, buildChoiceGroup } from './fill-cashbox.js';

const { MODE_FULL, MODE_ANOMALY, SAMPLE_SIZE } = FillSubmit;

// ============================================================
// 小工具：DOM 建構（做法同 overview.js／fill-cashbox.js，模組自己一份）
// ============================================================

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const value = attrs[key];
      if (value === undefined || value === null) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      // hidden 走 IDL 屬性（同真實 DOM 的反映規則），因為畫面其餘地方一律用
      // `.hidden = true/false` 這個屬性切換顯示，不是走 attribute——兩邊要用同一套。
      else if (key === 'hidden') node.hidden = true;
      else node.setAttribute(key, value);
    }
  }
  if (children) {
    for (const child of children) if (child) node.appendChild(child);
  }
  return node;
}

function escEl(ctx, tag, attrs, value) {
  const node = el(tag, attrs);
  node.innerHTML = ctx.fmt.esc(value);
  return node;
}

function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

// 本模組唯一支援的年份，同 overview.js 的 YEARS（之後要加年份，兩檔一起加）。
const YEAR = '2026';

function buildMonthList() {
  const months = [];
  for (let m = 1; m <= 12; m++) months.push(YEAR + '-' + pad2(m));
  return months;
}

/**
 * @param {HTMLElement} root 殼／index.js 給的掛載點
 * @param {object} ctx spec §4.7
 * @returns {function} unmount
 */
export function mountFill(root, ctx) {
  let destroyed = false;
  const canWrite = ctx.can('audit.write');

  if (!canWrite) {
    const card = el('div', { class: 'card' }, [
      el('div', { class: 'card-title', text: '稽核填寫' }),
      el('p', { class: 'field-hint', text: '沒有填寫權限，無法使用這個分頁。' })
    ]);
    root.appendChild(card);
    return function unmount() {
      destroyed = true;
      if (card.parentNode) card.parentNode.removeChild(card);
    };
  }

  // ---- 資料狀態（destroyed 之前都可能被 loadData() 更新）----
  let config = { stores: [], reasons: [] };
  let allItems = [];
  let allDetails = [];
  let records = [];

  // ---- 畫面狀態 ----
  let mode = FillSubmit.loadMode();
  let currentStore = '';
  let currentMonth = '';
  let items = []; // [{name, unit, lastDrawn, book_qty, recount_qty, verdict, reason, note}]
  let vaultState = { change_fund: '', petty_cash: '', tip_amount: '', tip_match: '', note: '' };

  const months = buildMonthList();
  const params = ctx.params || {};

  // ============================================================
  // 骨架
  // ============================================================

  const storeSelect = el('select', { id: 'audit-store', class: 'input' });
  const monthSelect = el('select', { id: 'audit-month', class: 'input' });
  months.forEach((m) => monthSelect.appendChild(el('option', { value: m, text: m + '（' + Format.monthLabel(m) + '）' })));

  const selectCard = el('div', { class: 'card' }, [
    el('div', { class: 'card-title', text: '稽核填寫' }),
    el('div', { class: 'field' }, [el('label', { class: 'field-label', for: 'audit-store', text: '店' }), storeSelect]),
    el('div', { class: 'field' }, [el('label', { class: 'field-label', for: 'audit-month', text: '月份' }), monthSelect])
  ]);

  const draftsList = el('ul', { id: 'audit-drafts-list' });
  const draftsCard = el('div', { class: 'card', id: 'audit-drafts-card', hidden: 'true' }, [
    el('div', { class: 'card-title', text: '未送出的草稿' }),
    el('p', { class: 'field-hint', text: '填到一半離開的內容都還在，點一下就接著填。' }),
    draftsList
  ]);

  const modeHint = el('p', { id: 'audit-mode-hint', class: 'field-hint' });
  const modeGroup = el('div', { id: 'audit-mode-group' });
  const modeCard = el('div', { class: 'card' }, [
    el('div', { class: 'card-title', text: '填寫方式' }),
    modeGroup,
    modeHint
  ]);

  const drawBtn = el('button', { type: 'button', id: 'audit-draw', class: 'btn btn-primary', text: '隨機抽 ' + SAMPLE_SIZE + ' 項' });
  const addInput = el('input', { type: 'text', id: 'audit-add-input', class: 'input', list: 'audit-item-datalist' });
  const datalist = el('datalist', { id: 'audit-item-datalist' });
  const addUnitInput = el('input', { type: 'text', id: 'audit-add-unit', class: 'input' });
  const addBtn = el('button', { type: 'button', id: 'audit-add-btn', class: 'btn btn-secondary' });
  const addHintEl = el('p', { id: 'audit-add-hint', class: 'field-hint' });
  const addErrorEl = el('p', { id: 'audit-add-error', class: 'field-hint', hidden: 'true' });
  const warningEl = el('p', { id: 'audit-count-warning', hidden: 'true' });
  const itemsEl = el('ul', { id: 'audit-items' });

  const samplingCard = el('div', { class: 'card' }, [
    el('div', { class: 'card-title', text: '品項抽查' }),
    drawBtn,
    el('div', { id: 'audit-add-row' }, [
      el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '加入品項' }), addInput, datalist]),
      el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '單位' }), addUnitInput]),
      addBtn,
      addHintEl,
      addErrorEl
    ]),
    warningEl,
    el('div', { class: 'table-wrap' }, [itemsEl])
  ]);

  const vaultCardHandle = mountVaultCard(ctx, () => config, () => vaultState, (patch) => {
    vaultState = Object.assign({}, vaultState, patch);
    saveDraft();
  });

  const submitErrorEl = el('p', { id: 'audit-submit-error', class: 'field-hint', hidden: 'true' });
  const submitBtn = el('button', { type: 'button', id: 'audit-submit-btn', class: 'btn btn-primary', text: '送出稽核' });
  const retryBtn = el('button', { type: 'button', id: 'audit-retry-btn', class: 'btn btn-secondary', text: '重試送出', hidden: 'true' });

  root.appendChild(selectCard);
  root.appendChild(draftsCard);
  root.appendChild(modeCard);
  root.appendChild(samplingCard);
  root.appendChild(vaultCardHandle.el);
  root.appendChild(submitErrorEl);
  root.appendChild(submitBtn);
  root.appendChild(retryBtn);

  // ============================================================
  // 衍生資料
  // ============================================================

  function currentStoreItems() {
    return allItems.filter((it) => it.store === currentStore && it.active !== false);
  }
  function currentStoreDetails() {
    return allDetails.filter((d) => d.store === currentStore);
  }
  function libraryItem(name) {
    return currentStoreItems().filter((it) => it.name === name)[0] || null;
  }
  function findIndexByName(name) {
    return items.findIndex((it) => it.name === name);
  }

  // ============================================================
  // 渲染：填寫方式
  // ============================================================

  function renderMode() {
    // 不直接用 buildChoiceGroup()：它的按鈕文字＝值本身（MODE_FULL/MODE_ANOMALY），
    // 這裡需要中文標籤，自己組（data-mode／.audit-mode-btn 這組 class／屬性沿用同慣例）。
    while (modeGroup.firstChild) modeGroup.removeChild(modeGroup.firstChild);
    const wrap = el('div', { class: 'audit-choice-group card-row' });
    [
      { v: MODE_FULL, label: '完整 ' + SAMPLE_SIZE + ' 項' },
      { v: MODE_ANOMALY, label: '只填異常項' }
    ].forEach(({ v, label }) => {
      const active = mode === v;
      const btn = el('button', {
        type: 'button',
        class: 'btn ' + (active ? 'btn-primary' : 'btn-secondary') + ' audit-mode-btn' + (active ? ' active' : ''),
        'data-mode': v,
        text: label
      });
      btn.addEventListener('click', () => onModeChange(v));
      wrap.appendChild(btn);
    });
    modeGroup.appendChild(wrap);

    if (mode === MODE_ANOMALY) {
      modeHint.textContent = '只輸入異常的品項，其餘視同正確；正確率固定以 ' + SAMPLE_SIZE + ' 項為分母計算。';
      drawBtn.hidden = true;
      addInput.setAttribute('placeholder', '輸入異常品項名稱加入');
      addBtn.textContent = '加入異常品項';
    } else {
      modeHint.textContent = '抽滿 ' + SAMPLE_SIZE + ' 項逐項核定正確／異常，正確率以實際清單項數為分母。';
      drawBtn.hidden = false;
      addInput.setAttribute('placeholder', '輸入品項名稱加入');
      addBtn.textContent = '加入品項';
    }
    hideAddError();
  }

  function onModeChange(next) {
    if (next === mode) return;
    saveDraft(); // 先把目前模式的內容存起來，再換過去（兩把 key 各存各的）
    mode = next;
    FillSubmit.persistMode(mode);
    tryRestoreOrReset();
  }

  // ============================================================
  // 渲染：品項清單
  // ============================================================

  function renderDatalist() {
    while (datalist.firstChild) datalist.removeChild(datalist.firstChild);
    currentStoreItems().forEach((it) => {
      datalist.appendChild(el('option', { value: it.name }));
    });
  }

  function setWarning(text, kind) {
    warningEl.className = kind ? 'tag ' + kind : '';
    warningEl.textContent = text || '';
    warningEl.hidden = !text;
  }

  function renderWarning() {
    if (mode === MODE_ANOMALY) {
      if (FillSubmit.tooManyAnomalies(mode, items.length, SAMPLE_SIZE)) {
        setWarning('異常 ' + items.length + ' 項，已超過標準 ' + SAMPLE_SIZE + ' 項，請刪除多餘項目後再送出', 'tag-danger');
        return;
      }
      const counts = Format.anomalyOnlyCounts(items.length, SAMPLE_SIZE);
      setWarning('異常 ' + items.length + ' 項，其餘視同正確 → 正確率 ' + counts.correct_rate +
        '%（' + counts.correct_count + '／' + SAMPLE_SIZE + '，分母固定 ' + SAMPLE_SIZE + ' 項）', 'tag');
      return;
    }
    if (items.length === SAMPLE_SIZE) {
      setWarning('', '');
    } else {
      // 品項庫不足 SAMPLE_SIZE 項時會抽不滿——這是正常情況、不是錯誤，只用提示告知，
      // 不擋任何操作（會計可以用下面的「加入品項」現場補，也可以不補直接送出）。
      setWarning('目前 ' + items.length + ' 項（標準 ' + SAMPLE_SIZE + ' 項）', 'tag-warn');
    }
  }

  function hideAddError() {
    addErrorEl.hidden = true;
    addErrorEl.textContent = '';
  }
  function showAddError(msg) {
    addErrorEl.textContent = msg;
    addErrorEl.hidden = false;
  }

  function buildItemRow(it) {
    const anomalyMode = mode === MODE_ANOMALY;
    const isAnomaly = anomalyMode || it.verdict === '異常';

    const nameSpan = escEl(ctx, 'span', { class: 'audit-item-name' }, it.name);
    const unitSpan = it.unit
      ? escEl(ctx, 'span', { class: 'audit-item-unit' }, '(' + it.unit + ')')
      : el('span', { class: 'audit-item-unit tag tag-danger', text: '缺單位' });
    const flagSpan = it.lastDrawn
      ? escEl(ctx, 'span', { class: 'audit-item-flag tag tag-warn' }, '⚠ ' + it.lastDrawn + ' 抽過')
      : null;
    const headLeft = el('span', {}, [nameSpan, unitSpan, flagSpan]);

    const redrawBtn = anomalyMode ? null : el('button', {
      type: 'button', class: 'btn btn-secondary audit-item-redraw', 'data-name': it.name, text: '換一項'
    });
    if (redrawBtn) redrawBtn.addEventListener('click', () => onRedraw(it.name));

    const removeBtn = el('button', {
      type: 'button', class: 'btn btn-danger audit-item-remove', 'data-name': it.name, text: '刪除'
    });
    removeBtn.addEventListener('click', () => onRemove(it.name));

    const headRow = el('div', { class: 'card-row' }, [headLeft, el('span', { class: 'card-row' }, [redrawBtn, removeBtn])]);

    const bookInput = el('input', {
      type: 'number', step: 'any', inputmode: 'decimal', class: 'input audit-book-qty',
      value: it.book_qty === undefined || it.book_qty === null ? '' : it.book_qty
    });
    bookInput.addEventListener('input', () => {
      it.book_qty = bookInput.value;
      saveDraft();
    });

    const recountInput = el('input', {
      type: 'number', step: 'any', inputmode: 'decimal', class: 'input audit-recount-qty',
      value: it.recount_qty === undefined || it.recount_qty === null ? '' : it.recount_qty
    });
    recountInput.addEventListener('input', () => {
      it.recount_qty = recountInput.value;
      saveDraft();
    });

    const qtyChildren = [
      el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '門市盤點數' }), bookInput]),
      el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '會計複盤數' }), recountInput])
    ];
    if (!it.unit) {
      // 品項庫有項目當初沒印單位（留空），抽到這種項目異常說明會少一塊，缺單位的當場補。
      const unitInput = el('input', { type: 'text', class: 'input audit-item-unit-input audit-unit-fix', value: '' });
      unitInput.addEventListener('input', () => {
        it.unit = unitInput.value;
        saveDraft();
      });
      qtyChildren.push(el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '單位' }), unitInput]));
    }
    const qtyRow = el('div', { class: 'audit-item-qty-row card-row' }, qtyChildren);

    const verdictGroup = anomalyMode ? null : buildChoiceGroup(
      'verdict', ['正確', '異常'], it.verdict, (g, v) => onVerdictChange(it.name, v), 'audit-verdict-btn'
    );

    let anomalyDetail = null;
    if (isAnomaly) {
      const reasonSelect = el('select', { class: 'input audit-reason' });
      reasonSelect.appendChild(el('option', { value: '', text: '請選擇' }));
      (config.reasons || []).forEach((r) => reasonSelect.appendChild(el('option', { value: r, text: r })));
      reasonSelect.value = it.reason || '';
      reasonSelect.addEventListener('change', () => {
        it.reason = reasonSelect.value;
        saveDraft();
        renderItems();
      });

      const noteInput = el('input', {
        type: 'text', class: 'input audit-item-note', value: it.note || '',
        placeholder: it.reason === '其他' ? '必填：請說明原因' : '選填'
      });
      noteInput.addEventListener('input', () => {
        it.note = noteInput.value;
        saveDraft();
      });

      anomalyDetail = el('div', { class: 'audit-anomaly-detail card' }, [
        el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '異常原因' }), reasonSelect]),
        el('div', { class: 'field' }, [el('label', { class: 'field-label', text: '備註' }), noteInput])
      ]);
    }

    const fillBlock = el('div', { class: 'audit-item-fill' }, [qtyRow, verdictGroup, anomalyDetail]);
    return el('li', { class: 'audit-item-row', 'data-item': it.name, 'data-unit': it.unit }, [headRow, fillBlock]);
  }

  function renderItems() {
    while (itemsEl.firstChild) itemsEl.removeChild(itemsEl.firstChild);
    items.forEach((it) => itemsEl.appendChild(buildItemRow(it)));
    renderWarning();
    saveDraft();
  }

  function setItems(newItems) {
    items = newItems;
    renderItems();
  }

  function onRedraw(name) {
    const idx = findIndexByName(name);
    if (idx === -1) return;
    const currentNames = items.map((it) => it.name);
    const replacement = Sampling.redrawOne(currentNames, currentStoreItems(), currentStoreDetails());
    if (replacement) {
      items = items.slice();
      items[idx] = FillSubmit.normalizeItem(replacement, mode);
      renderItems();
    } else {
      ctx.ui.toast('已無其他品項可替換', 'warn');
    }
  }

  function onRemove(name) {
    items = items.filter((it) => it.name !== name);
    renderItems();
  }

  function onVerdictChange(name, verdict) {
    const idx = findIndexByName(name);
    if (idx === -1) return;
    items[idx].verdict = verdict;
    if (verdict !== '異常') {
      items[idx].reason = '';
      items[idx].note = '';
    }
    renderItems();
  }

  function addItemByName(name) {
    hideAddError();
    name = (name || '').trim();
    if (!name) {
      showAddError('請先輸入品項名稱');
      return;
    }
    if (items.some((it) => it.name === name)) {
      showAddError('「' + name + '」已在清單中');
      return;
    }
    const hit = libraryItem(name);
    const unit = hit ? (addUnitInput.value.trim() || hit.unit || '') : addUnitInput.value.trim();
    if (!unit) {
      showAddError(hit
        ? '品項庫沒有填「' + name + '」的單位，請補一個（例：包、盒、公斤）'
        : '「' + name + '」不在品項庫，請一併填單位（例：包、盒、公斤）');
      return;
    }
    items = items.concat([FillSubmit.normalizeItem({
      name, unit, lastDrawn: Sampling.lastDrawnOf(name, currentStoreDetails())
    }, mode)]);
    renderItems();
    addInput.value = '';
    addUnitInput.value = '';
    addHintEl.textContent = '';
  }

  // ============================================================
  // 草稿還原／重置
  // ============================================================

  function saveDraft() {
    FillSubmit.saveDraft(currentStore, currentMonth, mode, items, vaultState);
  }

  function applyDraft(draft) {
    items = (draft.items || []).map((it) => FillSubmit.normalizeItem(it, mode));
    const v = draft.vault || {};
    vaultState = {
      change_fund: v.change_fund || '',
      petty_cash: v.petty_cash || '',
      tip_amount: v.tip_amount !== undefined && v.tip_amount !== null ? v.tip_amount : '',
      tip_match: v.tip_match || '',
      note: v.note || ''
    };
  }

  function resetState() {
    items = [];
    vaultState = { change_fund: '', petty_cash: '', tip_amount: '', tip_match: '', note: '' };
  }

  function tryRestoreOrReset() {
    const draft = FillSubmit.loadDraft(currentStore, currentMonth, mode);
    if (draft) {
      applyDraft(draft);
    } else {
      resetState();
    }
    renderMode();
    renderItems();
    vaultCardHandle.refresh();
    renderDrafts();
    hideSubmitError();
    retryBtn.hidden = true;
  }

  // ============================================================
  // 未送出草稿一覽
  // ============================================================

  function storeLabel(code) {
    const hit = (config.stores || []).find((s) => s.code === code);
    return hit ? hit.name : code;
  }

  function renderDrafts() {
    const others = FillSubmit.listDrafts().filter(
      (d) => !(d.store === currentStore && d.month === currentMonth && d.mode === mode)
    );
    while (draftsList.firstChild) draftsList.removeChild(draftsList.firstChild);
    if (!others.length) {
      draftsCard.hidden = true;
      return;
    }
    draftsCard.hidden = false;
    others.forEach((d) => {
      const modeTxt = d.mode === MODE_ANOMALY ? '只填異常項' : '完整 ' + SAMPLE_SIZE + ' 項';
      const resumeBtn = escEl(ctx, 'button', {
        type: 'button', class: 'btn btn-secondary audit-draft-resume', 'data-key': d.key
      }, storeLabel(d.store) + '　' + Format.monthLabel(d.month) + '（' + modeTxt + '·已填 ' + d.count + ' 項）');
      resumeBtn.addEventListener('click', () => resumeDraft(d.key));

      const dropBtn = el('button', {
        type: 'button', class: 'btn btn-danger audit-draft-drop', 'data-key': d.key, text: '丟棄'
      });
      dropBtn.addEventListener('click', () => {
        FillSubmit.dropDraft(d.key);
        renderDrafts();
      });

      draftsList.appendChild(el('li', { class: 'audit-draft-row card-row' }, [resumeBtn, dropBtn]));
    });
  }

  function resumeDraft(key) {
    const payload = FillSubmit.readDraftByKey(key);
    if (!payload) return;
    saveDraft(); // 先保住目前這一份
    currentStore = payload.store;
    currentMonth = payload.month;
    mode = /_anomaly$/.test(key) ? MODE_ANOMALY : MODE_FULL;
    FillSubmit.persistMode(mode);
    storeSelect.value = currentStore;
    monthSelect.value = currentMonth;
    renderDatalist();
    tryRestoreOrReset();
  }

  // ============================================================
  // 送出
  // ============================================================

  function hideSubmitError() {
    submitErrorEl.hidden = true;
    submitErrorEl.textContent = '';
  }
  function showSubmitError(msg) {
    submitErrorEl.textContent = msg;
    submitErrorEl.hidden = false;
  }
  function showSubmitFailure() {
    showSubmitError('送出失敗，草稿已保留，請按下方「重試送出」再試一次');
    retryBtn.hidden = false;
    ctx.ui.toast('送出失敗，請重試', 'danger');
  }

  async function performSubmit() {
    hideSubmitError();
    retryBtn.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中…';
    const record = FillSubmit.buildRecord({ store: currentStore, month: currentMonth, mode, items, vault: vaultState, sampleSize: SAMPLE_SIZE });
    const details = FillSubmit.buildDetails({ store: currentStore, month: currentMonth, items, mode });
    try {
      const res = await sharedApi.submit(ctx, 'submitAudit', { record, details });
      if (destroyed) return;
      submitBtn.disabled = false;
      submitBtn.textContent = '送出稽核';
      if (res && res.ok) {
        // submit() 成功時已經呼叫過 invalidate()（見 audit-shared/api.js），下一次
        // 進報告頁（T2-4）呼叫 getAll() 就會拿到剛送出的新資料，不必像舊版
        // app.reload() 那樣在這裡手動重抓一次。
        FillSubmit.clearDraft(currentStore, currentMonth);
        ctx.ui.toast('稽核已送出', 'ok');
        ctx.nav('report', { store: currentStore, month: currentMonth });
      } else {
        showSubmitFailure();
      }
    } catch (e) {
      if (destroyed) return;
      submitBtn.disabled = false;
      submitBtn.textContent = '送出稽核';
      showSubmitFailure();
    }
  }

  async function doSubmit() {
    hideSubmitError();
    const errors = FillSubmit.validate({ mode, items, vault: vaultState, sampleSize: SAMPLE_SIZE });
    if (errors.length) {
      showSubmitError(errors.join('\n'));
      ctx.ui.toast('請修正下列問題再送出', 'danger');
      return;
    }
    const key = Format.recordKey(currentStore, currentMonth);
    const existing = records.find((r) => r.record_key === key);
    if (existing) {
      const ok = await ctx.ui.confirm('將覆蓋 ' + (existing.audit_date || '') + ' 的紀錄，確定送出？');
      if (!ok || destroyed) return;
    }
    await performSubmit();
  }

  // ============================================================
  // 事件：選店／選月
  // ============================================================

  function onStoreChange() {
    saveDraft();
    currentStore = storeSelect.value;
    FillSubmit.persistLastStore(currentStore);
    renderDatalist();
    tryRestoreOrReset();
  }
  function onMonthChange() {
    saveDraft();
    currentMonth = monthSelect.value;
    tryRestoreOrReset();
  }
  storeSelect.addEventListener('change', onStoreChange);
  monthSelect.addEventListener('change', onMonthChange);

  drawBtn.addEventListener('click', () => {
    setItems(Sampling.drawSample(currentStoreItems(), currentStoreDetails(), SAMPLE_SIZE).map((it) => FillSubmit.normalizeItem(it, mode)));
  });
  addBtn.addEventListener('click', () => addItemByName(addInput.value));
  addInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault ? e.preventDefault() : null;
      addItemByName(addInput.value);
    }
  });

  submitBtn.addEventListener('click', () => { doSubmit(); });
  retryBtn.addEventListener('click', () => { performSubmit(); });

  // ============================================================
  // 初始化
  // ============================================================

  function pickDefaultStore() {
    const codes = (config.stores || []).map((s) => s.code);
    if (params.store && codes.indexOf(params.store) !== -1) return params.store;
    const saved = FillSubmit.loadLastStore();
    if (saved && codes.indexOf(saved) !== -1) return saved;
    return codes[0] || '';
  }

  async function loadData() {
    ctx.ui.loading(true);
    try {
      const res = await sharedApi.getAll(ctx);
      if (destroyed) return;
      if (!res || res.ok !== true) {
        ctx.ui.toast((res && res.error) || '發生錯誤，請稍後再試', 'danger');
        return;
      }
      config = (res.data && res.data.config) || { stores: [], reasons: [] };
      allItems = (res.data && res.data.items) || [];
      allDetails = (res.data && res.data.details) || [];
      records = (res.data && res.data.records) || [];

      while (storeSelect.firstChild) storeSelect.removeChild(storeSelect.firstChild);
      (config.stores || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)).forEach((s) => {
        storeSelect.appendChild(escEl(ctx, 'option', { value: s.code }, s.name));
      });

      currentStore = pickDefaultStore();
      storeSelect.value = currentStore;

      // 不是從別處帶 month 進來時，若這家店有未送出的草稿，落在那份草稿的月份與模式上
      // （同舊版 latestDraftForStore()：否則只回到店、月份卻是當月，看起來像內容不見了）。
      const resumeTarget = params.month ? null : FillSubmit.latestDraftForStore(currentStore);
      const now = new Date();
      const realMonthStr = String(now.getFullYear()) + '-' + pad2(now.getMonth() + 1);
      currentMonth = params.month
        ? params.month
        : (resumeTarget ? resumeTarget.month : (String(now.getFullYear()) === YEAR ? realMonthStr : months[0]));
      if (months.indexOf(currentMonth) === -1) currentMonth = months[0];
      monthSelect.value = currentMonth;
      mode = resumeTarget ? resumeTarget.mode : mode;

      renderDatalist();
      tryRestoreOrReset();
    } catch (e) {
      if (!destroyed) ctx.ui.toast('發生錯誤，請稍後再試', 'danger');
    } finally {
      if (!destroyed) ctx.ui.loading(false);
    }
  }

  loadData();

  return function unmount() {
    destroyed = true;
    storeSelect.removeEventListener('change', onStoreChange);
    monthSelect.removeEventListener('change', onMonthChange);
    [selectCard, draftsCard, modeCard, samplingCard, vaultCardHandle.el, submitErrorEl, submitBtn, retryBtn].forEach((n) => {
      if (n && n.parentNode) n.parentNode.removeChild(n);
    });
  };
}

</script>

<script type="module">
(async function () {
  function srcOf(id) {
    return document.getElementById(id).textContent;
  }
  function blobify(text) {
    return URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
  }
  // 只替換「原始碼裡的 import 路徑字面字串」成對應的 blob URL，函式本身、
  // DOM 邏輯、事件處理一個字元都不動——這就是任務指示允許的「import 展開」做法。
  function rewrite(text, pairs) {
    let out = text;
    for (const [from, to] of pairs) out = out.split(from).join(to);
    return out;
  }

  try {
    // ---- 沒有相依的葉節點模組，直接原樣做成 blob ----
    const fmtUrl = blobify(srcOf('src-fmt'));
    const formatUrl = blobify(srcOf('src-format'));
    const samplingUrl = blobify(srcOf('src-sampling'));
    const mockdataUrl = blobify(srcOf('src-mockdata'));
    const opschecklistUrl = blobify(srcOf('src-opschecklist'));
    const apiUrl = blobify(srcOf('src-api'));
    const fillcashboxUrl = blobify(srcOf('src-fillcashbox'));

    // ---- 依相依順序改寫 import 路徑 ----
    const uiUrl = blobify(rewrite(srcOf('src-ui'), [
      ["'./fmt.js'", "'" + fmtUrl + "'"]
    ]));

    const umdbridgeUrl = blobify(rewrite(srcOf('src-umdbridge'), [
      ["'./format.js'", "'" + formatUrl + "'"],
      ["'./sampling.js'", "'" + samplingUrl + "'"],
      ["'./mock-data.js'", "'" + mockdataUrl + "'"],
      ["'./ops-checklist.js'", "'" + opschecklistUrl + "'"]
    ]));

    const fillsubmitUrl = blobify(rewrite(srcOf('src-fillsubmit'), [
      ["'../../audit-shared/umd-bridge.js'", "'" + umdbridgeUrl + "'"]
    ]));

    const overviewUrl = blobify(rewrite(srcOf('src-overview'), [
      ["'../../audit-shared/api.js'", "'" + apiUrl + "'"]
    ]));

    const fillUrl = blobify(rewrite(srcOf('src-fill'), [
      ["'../../audit-shared/api.js'", "'" + apiUrl + "'"],
      ["'../../audit-shared/umd-bridge.js'", "'" + umdbridgeUrl + "'"],
      ["'./fill-submit.js'", "'" + fillsubmitUrl + "'"],
      ["'./fill-cashbox.js'", "'" + fillcashboxUrl + "'"]
    ]));

    const [uiMod, fmtMod, umdBridgeMod, overviewMod, fillMod] = await Promise.all([
      import(uiUrl),
      import(fmtUrl),
      import(umdbridgeUrl),
      import(overviewUrl),
      import(fillUrl)
    ]);

    const { toast, loading, confirm, dialog, signaturePad } = uiMod;
    const { esc, date, datetime, roc, money } = fmtMod;
    const { MockData } = umdBridgeMod;
    const { mountOverview } = overviewMod;
    const { mountFill } = fillMod;

    // ============================================================
    // 假 ctx（spec §4.7 的形狀，逐項對照任務指示第 5 點）
    // ============================================================

    function buildPreviewSummaryEl(action, payload) {
      const wrap = document.createElement('div');
      wrap.className = 'preview-summary';
      const p = document.createElement('p');
      p.textContent = '這是預覽版，並未真的送出到後端。action＝「' + action + '」，實際會送出的內容如下：';
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(payload, null, 2);
      wrap.appendChild(p);
      wrap.appendChild(pre);
      return wrap;
    }

    // 任何「送出類」action（submitAudit／markRest…）一律攔下：不打任何後端、
    // 改跳一個對話框顯示 payload 摘要，使用者按下「我知道了」才算數（任務指示第 6 點）。
    async function apiCall(moduleId, action, payload) {
      await new Promise((r) => setTimeout(r, 200)); // 模擬延遲，純本機計時，不是網路
      if (action === 'getAll') {
        return {
          ok: true,
          data: {
            config: MockData.config,
            items: MockData.items,
            records: MockData.records,
            details: MockData.details
          }
        };
      }
      await dialog({
        title: '這是預覽版',
        body: buildPreviewSummaryEl(action, payload),
        actions: [{ label: '我知道了', value: true, variant: 'primary' }]
      });
      return { ok: true, data: { preview: true, action, payload } };
    }

    const ctx = {
      user: { id: 'u001', name: '預覽帳號（會計）', role: 'accountant', node: null },
      can: () => true, // 任務指示第 5 點：一律回 true，讓 Eason 看得到全部控制項
      api: { call: apiCall },
      ui: { toast, loading, confirm, dialog, signaturePad },
      fmt: { date, datetime, roc, esc, money },
      nav: (viewId, params) => mountView(viewId, params),
      viewId: 'overview',
      params: {}
    };

    // ============================================================
    // 最小外框：兩個分頁互相切換，切換時把上一個畫面 unmount 掉
    // ============================================================

    const viewRoot = document.getElementById('view-root');
    const tabsEl = document.getElementById('preview-tabs');
    let currentUnmount = null;

    function setActiveTab(viewId) {
      tabsEl.querySelectorAll('.nav-item').forEach((btn) => {
        btn.classList.toggle('is-active', btn.getAttribute('data-view') === viewId);
      });
    }

    function mountView(viewId, params) {
      if (currentUnmount) {
        try { currentUnmount(); } catch (e) { console.error(e); }
        currentUnmount = null;
      }
      while (viewRoot.firstChild) viewRoot.removeChild(viewRoot.firstChild);

      // spec §4.7：同一個 ctx 物件原地更新 viewId／params，不是換新物件
      ctx.viewId = viewId === 'overview' || viewId === 'fill' ? viewId : ctx.viewId;
      ctx.params = params || {};

      if (viewId === 'overview') {
        setActiveTab('overview');
        currentUnmount = mountOverview(viewRoot, ctx);
      } else if (viewId === 'fill') {
        setActiveTab('fill');
        currentUnmount = mountFill(viewRoot, ctx);
      } else {
        // 這份預覽只做「總覽／稽核填寫」兩頁（任務指示第 4 點），
        // 真實系統會導去的「report」報告頁這裡沒有，安靜退回總覽並提示一下。
        toast('預覽版尚未包含「' + viewId + '」頁面，這兩頁已經是完整真實邏輯', 'warn');
        setActiveTab('overview');
        currentUnmount = mountOverview(viewRoot, ctx);
      }
    }

    tabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-item');
      if (!btn) return;
      mountView(btn.getAttribute('data-view'), {});
    });

    mountView('overview', {});
  } catch (err) {
    console.error('[預覽版] 初始化失敗：', err);
    const box = document.createElement('div');
    box.className = 'preview-boot-error';
    box.textContent = '預覽版初始化失敗：' + (err && err.stack ? err.stack : String(err));
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>
